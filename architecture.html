<text x="228" y="520" font-size="11" font-family="Arial" fill="#b71c1c">Decode:  Q  [B, 1, 8-head, d_head]</text>

<line x1="210" y1="588" x2="600" y2="588" stroke="#e0b080" stroke-width="0.8" stroke-dasharray="4,2"/>

<text x="214" y="604" font-size="11" font-weight="bold" font-family="Arial" fill="#5d4037">③ Attention:  Q × Kᵀ / √d_head  (causal mask)</text>

<text x="228" y="635" font-size="11" font-family="Arial" fill="#b71c1c">Decode:  Q[1]  × K[N+i]ᵀ →  1 × (N+i)  （單 token 對全歷史）</text>

<line x1="210" y1="646" x2="600" y2="646" stroke="#e0b080" stroke-width="0.8" stroke-dasharray="4,2"/>
